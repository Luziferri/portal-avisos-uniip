      function Dashboard() {
        const sectionHashMap = {
          feed: "#feed",
          filtros: "#filtros",
          professor: "#publicar",
        };

        const [session, setSession] = useState(() => {
          return null;
        });
        const [profile, setProfile] = useState(null);
        const [authReady, setAuthReady] = useState(false);
        const [authLoading, setAuthLoading] = useState(true);
        const [themeMode, setThemeMode] = useState(() => {
          try {
            return localStorage.getItem("uniip-theme") || "light";
          } catch {
            return "light";
          }
        });
        const [publishError, setPublishError] = useState("");
        const [loginRole, setLoginRole] = useState("aluno");
        const [loginIdentifier, setLoginIdentifier] = useState(
          mockAccounts.aluno.username,
        );
        const [loginPassword, setLoginPassword] = useState(
          mockAccounts.aluno.password,
        );
        const [loginError, setLoginError] = useState("");
        const [authInfo, setAuthInfo] = useState("");
        const [announcementForm, setAnnouncementForm] = useState({
          title: "",
          description: "",
          school: "ESE",
          category: "Evento",
          expiresAt: "",
        });
        const [search, setSearch] = useState("");
        const [selectedSchool, setSelectedSchool] = useState("Todas");
        const [selectedCategory, setSelectedCategory] = useState("Todas");
        const [announcements, setAnnouncements] = useState([]);
        const [visibleAnnouncements, setVisibleAnnouncements] = useState([]);
        const [activeSection, setActiveSection] = useState("feed");
        const [currentView, setCurrentView] = useState("dashboard");
        const announcementsRequestRef = useRef(0);

        const isDark = themeMode === "dark";
        const currentAccount = profile || session;
        const supabaseReady = Boolean(supabaseClient);

        const loadAnnouncements = async () => {
          if (!supabaseClient) return [];
          try {
            const query = supabaseClient
              .from("announcements")
              .select(
                "id, title, description, school, category, created_at, expires_at",
              )
              .order("created_at", { ascending: false });

            const { data } = await query;
            return data || [];
          } catch (err) {
            console.error("Load announcements error:", err);
            return [];
          }
        };

        const loadProfile = async (user) => {
          if (!supabaseClient || !user) return null;

          try {
            const PROFILE_TIMEOUT = 4500;
            const timeoutMarker = Symbol("profile-timeout");
            const timeoutPromise = new Promise((resolve) =>
              setTimeout(() => resolve(timeoutMarker), PROFILE_TIMEOUT),
            );

            const profileRequest = supabaseClient
              .from("profiles")
              .select("id, full_name, username, role, school")
              .eq("id", user.id)
              .single();

            const result = await Promise.race([profileRequest, timeoutPromise]);

            // Keep auth flow responsive by falling back to a basic session.
            if (result === timeoutMarker) {
              return null;
            }

            const { data, error } = result;

            if (error) {
              // Missing profile rows are expected in some test scenarios.
              return null;
            }

            return data;
          } catch (err) {
            return null;
          }
        };

        useEffect(() => {
          if (!supabaseClient) {
            setAuthReady(true);
            setAuthLoading(false);
            setLoginError("Falta configurar a publishable key do Supabase.");
            return undefined;
          }

          let active = true;

          const bootstrap = async () => {
            try {
              const { data, error } = await supabaseClient.auth.getSession();

              if (!active) {
                return;
              }

              if (error) {
                console.error("getSession error:", error.message);
                setLoginError(error.message);
                setAuthReady(true);
                setAuthLoading(false);
                return;
              }

              const nextUser = data.session?.user || null;

              if (!nextUser) {
                setSession(null);
                setProfile(null);
                setAuthReady(true);
                setAuthLoading(false);
                return;
              }

              try {
                const nextProfile = await loadProfile(nextUser);
                if (!active) {
                  return;
                }

                setProfile(nextProfile);
                setSession({
                  id: nextUser.id,
                  email: nextUser.email,
                  role: nextProfile?.role || "Aluno",
                  name: nextProfile?.full_name || nextUser.email,
                  username:
                    nextProfile?.username ||
                    splitLoginIdentifier(nextUser.email),
                  school: nextProfile?.school || "ESE",
                });
              } catch (profileError) {
                if (!active) {
                  return;
                }

                console.error(
                  "Bootstrap profile error:",
                  profileError.message || profileError,
                );
                // Fallback: still allow login with basic info from auth
                setSession({
                  id: nextUser.id,
                  email: nextUser.email,
                  role: "Aluno",
                  name: nextUser.email,
                  username: splitLoginIdentifier(nextUser.email),
                  school: "ESE",
                });
                setProfile(null);
                setLoginError(""); // Don't show error, silently use fallback
              } finally {
                if (active) {
                  setAuthReady(true);
                  setAuthLoading(false);
                }
              }
            } catch (err) {
              console.error("Bootstrap error:", err);
              if (active) {
                setAuthReady(true);
                setAuthLoading(false);
                setLoginError("Erro ao carregar sessão.");
              }
            }
          };

          bootstrap();

          const {
            data: { subscription },
          } = supabaseClient.auth.onAuthStateChange(
            async (_event, nextSession) => {
              if (!active) {
                return;
              }

              try {
                if (!nextSession?.user) {
                  setSession(null);
                  setProfile(null);
                  setAuthReady(true);
                  setAuthLoading(false);
                  return;
                }

                try {
                  const nextProfile = await loadProfile(nextSession.user);
                  if (!active) {
                    return;
                  }

                  setProfile(nextProfile);
                  setSession({
                    id: nextSession.user.id,
                    email: nextSession.user.email,
                    role: nextProfile?.role || "Aluno",
                    name: nextProfile?.full_name || nextSession.user.email,
                    username:
                      nextProfile?.username ||
                      splitLoginIdentifier(nextSession.user.email),
                    school: nextProfile?.school || "ESE",
                  });
                } catch (profileError) {
                  if (!active) {
                    return;
                  }

                  console.error(
                    "Auth state profile error:",
                    profileError.message || profileError,
                  );
                  // Fallback: allow login with basic info
                  setSession({
                    id: nextSession.user.id,
                    email: nextSession.user.email,
                    role: "Aluno",
                    name: nextSession.user.email,
                    username: splitLoginIdentifier(nextSession.user.email),
                    school: "ESE",
                  });
                  setProfile(null);
                }
              } finally {
                if (active) {
                  setAuthReady(true);
                  setAuthLoading(false);
                }
              }
            },
          );

          return () => {
            active = false;
            subscription.unsubscribe();
          };
        }, []);

        useEffect(() => {
          const loadData = async () => {
            const requestId = ++announcementsRequestRef.current;
            const data = await loadAnnouncements();
            if (requestId !== announcementsRequestRef.current) {
              return;
            }
            setAnnouncements(data);
          };

          if (supabaseClient && currentView === "dashboard" && session) {
            loadData();

            // Sintaxe correta do Supabase V2
            const subscription = supabaseClient
              .channel("mudancas-avisos")
              .on(
                "postgres_changes",
                { event: "*", schema: "public", table: "announcements" },
                (payload) => {
                  loadData();
                },
              )
              .subscribe();

            return () => {
              announcementsRequestRef.current += 1;
              supabaseClient.removeChannel(subscription);
            };
          }
        }, [supabaseClient, currentView, session]);

        useEffect(() => {
          try {
            localStorage.setItem("uniip-theme", themeMode);
          } catch {
            // Ignore storage failures.
          }

          document.documentElement.classList.toggle("theme-dark", isDark);
          document.documentElement.style.colorScheme = isDark
            ? "dark"
            : "light";
        }, [themeMode, isDark]);

        useEffect(() => {
          const defaultAccount = mockAccounts[loginRole];
          setLoginIdentifier(defaultAccount.username);
          setLoginPassword(defaultAccount.password);
          setLoginError("");
          setAuthInfo("");
        }, [loginRole]);

        useEffect(() => {
          if (!currentAccount) {
            return;
          }

          const defaultSchool =
            currentAccount.role === "Professor"
              ? currentAccount.school || "ESCE"
              : currentAccount.school || "Todas";
          setSelectedSchool(defaultSchool);
        }, [currentAccount?.role, currentAccount?.school]);

        useEffect(() => {
          if (!currentAccount) {
            return;
          }

          if (currentView !== "dashboard") {
            return;
          }

          const sectionIds =
            currentAccount.role === "Professor"
              ? ["feed", "filtros", "professor"]
              : ["feed", "filtros"];

          const sections = sectionIds
            .map((id) => document.getElementById(id))
            .filter(Boolean);

          if (sections.length === 0) {
            return;
          }

          const observer = new IntersectionObserver(
            (entries) => {
              const visible = entries
                .filter((entry) => entry.isIntersecting)
                .sort((a, b) => b.intersectionRatio - a.intersectionRatio);

              if (visible[0]?.target?.id) {
                setActiveSection(visible[0].target.id);
              }
            },
            {
              rootMargin: "-140px 0px -50% 0px",
              threshold: [0.25, 0.5, 0.75],
            },
          );

          sections.forEach((section) => observer.observe(section));

          return () => observer.disconnect();
        }, [currentAccount?.role, currentView]);

        useEffect(() => {
          const syncViewFromHash = () => {
            const hash = window.location.hash.toLowerCase();

            if (hash === "#conta") {
              setCurrentView("account");
              setActiveSection("account");
              return;
            }

            let nextSection = "feed";
            if (hash === "#filtros") {
              nextSection = "filtros";
            } else if (hash === "#publicar" && session?.role === "Professor") {
              nextSection = "professor";
            }

            setCurrentView("dashboard");
            setActiveSection(nextSection);

            requestAnimationFrame(() => {
              const target = document.getElementById(nextSection);
              if (target) {
                target.scrollIntoView({ behavior: "smooth", block: "start" });
              }
            });
          };

          syncViewFromHash();
          window.addEventListener("hashchange", syncViewFromHash);

          return () =>
            window.removeEventListener("hashchange", syncViewFromHash);
        }, [currentAccount?.role]);

        const navigateToSection = (sectionId) => {
          const nextHash = sectionHashMap[sectionId] || "#feed";

          if (currentView !== "dashboard") {
            setCurrentView("dashboard");
            window.location.hash = nextHash;

            requestAnimationFrame(() => {
              const target = document.getElementById(sectionId);
              if (target) {
                target.scrollIntoView({ behavior: "smooth", block: "start" });
                setActiveSection(sectionId);
              }
            });

            return;
          }

          const target = document.getElementById(sectionId);

          if (!target) {
            return;
          }

          window.location.hash = nextHash;
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          setActiveSection(sectionId);
        };

        const navigateToAccountPage = () => {
          setCurrentView("account");
          setActiveSection("account");
          window.location.hash = "#conta";
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const handleLogin = async (event) => {
          event.preventDefault();

          if (!supabaseClient) {
            setLoginError("Falta configurar a publishable key do Supabase.");
            return;
          }

          const identifier = loginIdentifier.trim().toLowerCase();
          const password = loginPassword;

          if (!identifier || !password) {
            setLoginError("Preenche o email ou username e a password.");
            return;
          }

          setLoginError("");
          setAuthInfo("A autenticar...");

          try {
            let emailToUse = identifier;

            if (!identifier.includes("@")) {
              const { data, error } = await supabaseClient.rpc(
                "resolve_login_email",
                {
                  login_identifier: identifier,
                },
              );

              if (error || !data) {
                throw new Error("Credenciais inválidas.");
              }

              emailToUse = data;
            }

            const { error } = await supabaseClient.auth.signInWithPassword({
              email: emailToUse,
              password,
            });

            if (error) {
              throw error;
            }

                                  {Object.keys(schoolConfig).map((school) => (
                                    <option key={school} value={school}>
                                      {school} - {schoolConfig[school].name}
                                    </option>
                                  ))}
                                </select>
                              </label>

                              <label className="block space-y-2">
                                <span className="text-sm font-medium text-ink-700">
                                  Categoria
                                </span>
                                <select
                                  value={announcementForm.category}
                                  onChange={(event) =>
                                    setAnnouncementForm((current) => ({
                                      ...current,
                                      category: event.target.value,
                                    }))
                                  }
                                  className="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-ink-900"
                                >
                                  {Object.keys(categoryConfig).map(
                                    (category) => (
                                      <option key={category} value={category}>
                                        {category}
                                      </option>
                                    ),
                                  )}
                                </select>
                              </label>

                              <label className="block space-y-2">
                                <span className="text-sm font-medium text-ink-700">
                                  Data de expiração
                                </span>
                                <input
                                  type="date"
                                  value={announcementForm.expiresAt}
                                  onChange={(event) =>
                                    setAnnouncementForm((current) => ({
                                      ...current,
                                      expiresAt: event.target.value,
                                    }))
                                  }
                                  className="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none transition focus:border-ink-900"
                                />
                              </label>

                              <div className="flex items-end">
                                <button
                                  type="submit"
                                  className="inline-flex w-full items-center justify-center rounded-md bg-ink-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-ink-800"
                                >
                                  Publicar aviso
                                </button>
                              </div>
                            </div>
                          </form>
                        </section>
                      ) : null}

                      <div
                        className="scroll-mt-24 flex items-center justify-between border-b border-slate-200 pb-3"
                        id="feed"
                      >
                        <div>
                          <p className="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">
                            Lista editorial
                          </p>
                          <h2 className="text-xl font-semibold text-ink-950">
                            Avisos em destaque
                          </h2>
                        </div>
                        <div className="flex flex-wrap gap-2 text-sm text-slate-600">
                          <span className="inline-flex items-center gap-2">
                            <CalendarDays className="h-4 w-4" />
                            Mais recentes primeiro
                          </span>
                          <span className="inline-flex items-center gap-2">
                            <BellRing className="h-4 w-4" />
                            Leitura rápida
                          </span>
                        </div>
                      </div>

                      {visibleAnnouncements.length === 0 ? (
                        <div className="panel border-dashed p-10 text-center">
                          <h3 className="text-xl font-semibold text-ink-950">
                            Sem resultados com estes filtros
                          </h3>
                          <p className="mt-2 text-ink-600">
                            Tente limpar a pesquisa ou alterar a
                            Escola/Categoria para encontrar avisos.
                          </p>
                        </div>
                      ) : (
                        <div className="panel overflow-hidden divide-y divide-slate-200">
                          {visibleAnnouncements.map((announcement) => {
                            const school = schoolConfig[announcement.school];
                            const category =
                              categoryConfig[announcement.category];
                            const schoolName = school.name;
                            const expired = isExpired(announcement.expires_at);

                            const schoolIcon =
                              announcement.school === "ESE"
                                ? BookOpen
                                : announcement.school === "EST"
                                  ? GraduationCap
                                  : announcement.school === "ESS"
                                    ? HeartHandshake
                                    : Globe2;

                            const categoryIcon =
                              announcement.category === "Evento"
                                ? CalendarDays
                                : announcement.category === "Voluntariado"
                                  ? Users
                                  : Megaphone;

                            return (
                              <article
                                key={announcement.id}
                                className="group flex flex-col gap-4 px-4 py-5 transition duration-300 hover:bg-slate-50/50 md:flex-row md:items-start md:gap-5"
                              >
                                <div
                                  className={`h-1.5 w-20 shrink-0 rounded-full md:h-auto md:w-1 md:self-stretch ${school.badge}`}
                                />

                                <div className="min-w-0 flex-1 space-y-3">
                                  <div className="flex flex-wrap items-center gap-2">
                                    <div
                                      className={`inline-flex items-center gap-2 rounded-md border px-3 py-1 text-xs font-semibold ${school.classes}`}
                                    >
                                      {React.createElement(schoolIcon, {
                                        className: "h-3.5 w-3.5",
                                      })}
                                      {school.label}
                                    </div>
                                    <span className="inline-flex items-center rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold text-slate-600">
                                      {announcement.category}
                                    </span>
                                    {expired ? (
                                      <span className="inline-flex items-center rounded-md border border-coral-100 bg-coral-50 px-3 py-1 text-xs font-semibold text-coral-500">
                                        Expirado
                                      </span>
                                    ) : null}
                                  </div>

                                  <h3 className="text-xl font-semibold leading-8 text-ink-950">
                                    {announcement.title}
                                  </h3>

                                  <p className="max-w-3xl text-sm leading-6 text-ink-600">
                                    {announcement.description}
                                  </p>

                                  <div className="flex flex-wrap items-center gap-3 text-sm text-slate-500">
                                    <span className="inline-flex items-center gap-2">
                                      {React.createElement(categoryIcon, {
                                        className: "h-4 w-4",
                                      })}
                                      {schoolName}
                                    </span>
                                    <span>
                                      Publicado em{" "}
                                      {formatDate(announcement.created_at)}
                                    </span>
                                    <span>•</span>
                                    <span>
                                      {expired
                                        ? "Expirado"
                                        : `Expira em ${formatDate(announcement.expires_at)}`}
                                    </span>
                                  </div>
                                </div>
                              </article>
                            );
                          })}
                        </div>
                      )}
                    </>
                  )}
                </main>
              </div>
            </div>
          </div>
        );
      }

      function splitLoginIdentifier(value) {
        return String(value || "").split("@")[0];
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <Dashboard />,
      );
    </script>
  </head>
  <body class="bg-slate-100 antialiased">
    <div id="root"></div>
  </body>
</html>
